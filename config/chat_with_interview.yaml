default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 5
    handler_search_path:
      - "src/handlers"
    handler_configs:
      LamClient:
        module: client/h5_rendering_client/client_handler_lam
        asset_path: "lam_samples/james.zip"
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.1
        start_delay: 2048
        end_delay: 2000
        buffer_look_back: 10000
        speech_padding: 1024
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      CosyVoice:
        enabled: True
        module: tts/bailian_tts/tts_handler_cosyvoice_bailian
        voice: "longxiaocheng"
        model_name: "cosyvoice-v1"
        # api_key: "" # default=os.getenv("DASHSCOPE_API_KEY")
      LLMInterviewOpenAICompatible:
        enabled: True
        module: llm/interview_openai_compatible/llm_handler_interview_openai_compatible
        model_name: "qwen-plus"
        enable_video_input: False
        history_length: 20
        system_prompt: "你是模拟面试官，请按阶段推进面试并给出简洁、专业的问题与反馈。"
        api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        stage_order:
          - greeting
          - technical
          - resume
          - experience
          - closing
        stage_turn_limits:
          greeting: 2
          technical: 3
          resume: 3
          experience: 2
          closing: 1
        checkpoint_enabled: True
        # api_key: "" # default=os.getenv("DASHSCOPE_API_KEY")
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
